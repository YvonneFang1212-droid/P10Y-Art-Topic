<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>近十年全球艺术热点</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #FFFFFF;
    color: #4A4A4A;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body { display: flex; align-items: center; justify-content: center; }

  button { font: inherit; background: none; border: none; cursor: pointer; color: inherit; padding: 0; }
  a { text-decoration: none; color: inherit; }

  /* ============ 手机舞台 ============ */
  .stage {
    position: relative;
    width: 100%;
    max-width: 430px;
    height: 100dvh;
    background: #FFFFFF;
    overflow: hidden;
  }
  @media (min-width: 480px) {
    .stage {
      height: min(100dvh, 900px);
      box-shadow: 0 0 80px rgba(0, 0, 0, .06);
    }
  }

  /* ============ 图层 ============ */
  .layer {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: #FFFFFF;
    transition: filter .45s cubic-bezier(.4,0,.2,1),
                opacity .45s cubic-bezier(.4,0,.2,1),
                transform .45s cubic-bezier(.4,0,.2,1),
                visibility .45s;
    will-change: filter, opacity, transform;
  }

  .layer.depth-0 { filter: none; opacity: 1; transform: none; pointer-events: auto; visibility: visible; z-index: 30; }
  .layer.depth-1 { filter: blur(8px); opacity: .30; transform: scale(.98); pointer-events: none; visibility: visible; z-index: 20; }
  .layer.depth-2 { filter: blur(13px); opacity: .16; transform: scale(.96); pointer-events: none; visibility: visible; z-index: 10; }
  .layer.is-hidden { opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }

  /* ============ 开屏（字号 -50%，动效加快） ============ */
  #splash {
    z-index: 60;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  #splash h1 {
    writing-mode: vertical-rl;
    text-orientation: upright;
    letter-spacing: .16em;
    font-size: clamp(10.5px, 3vw, 21.5px);
    font-weight: 600;
    color: #000000;
    text-align: center;
    animation: breathe 1.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: .55; transform: scale(.97); }
    50%      { opacity: 1;   transform: scale(1.03); }
  }

  /* ============ 地域关系图（雷达扩散增强） ============ */
  #mapLayer {
    z-index: 50;
    align-items: center;
    justify-content: center;
  }
  .map-wrap {
    width: min(84%, 52vh);
    aspect-ratio: 1 / 1;
    position: relative;
  }
  .map {
    position: absolute;
    inset: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .ring {
    position: absolute;
    left: 50%;
    top: 50%;
    border: 1px solid #C8C8C8;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    will-change: transform, opacity;
  }
  .ring-world { width: 100%; height: 100%; animation: radar 1.9s ease-in-out infinite; animation-delay: .9s; }
  .ring-asia  { width: 75%;  height: 75%;  animation: radar 1.9s ease-in-out infinite; animation-delay: .6s; }
  .ring-cn    { width: 50%;  height: 50%;  animation: radar 1.9s ease-in-out infinite; animation-delay: .3s; }
  .ring-gba   { width: 25%;  height: 25%;  animation: radar 1.9s ease-in-out infinite; animation-delay: 0s; }

  @keyframes radar {
    0%   { transform: translate(-50%, -50%) scale(1);    opacity: .28; }
    45%  { transform: translate(-50%, -50%) scale(1.055); opacity: 1;   }
    100% { transform: translate(-50%, -50%) scale(1);    opacity: .28; }
  }

  .ring-label {
    position: absolute;
    left: 50%;
    text-align: center;
    color: #000000;
    font-weight: 600;
    font-size: clamp(11px, 3.2vw, 17px);
    line-height: 1.25;
    white-space: nowrap;
    pointer-events: none;
    letter-spacing: .04em;
  }
  .ring-label span {
    display: block;
    font-size: .52em;
    font-weight: 400;
    color: #7A7A7A;
    letter-spacing: .14em;
    margin-top: 3px;
  }
  .label-world { top: 6.25%;  transform: translate(-50%, -50%); }
  .label-asia  { top: 18.75%; transform: translate(-50%, -50%); }
  .label-cn    { top: 31.25%; transform: translate(-50%, -50%); }
  .label-gba   { top: 43.75%; transform: translate(-50%, -50%); }

  .hint {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
    left: 50%;
    transform: translateX(-50%);
    font-size: clamp(11px, 3vw, 13px);
    color: #7A7A7A;
    letter-spacing: .1em;
    white-space: nowrap;
    animation: breathe 2.2s ease-in-out infinite;
    pointer-events: none;
  }

  /* ============ 顶部栏 ============ */
  .topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 10px;
    background: rgba(255,255,255,.94);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border-bottom: 1px solid #F4F4F4;
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: clamp(12px, 3.2vw, 14px);
    color: #4A4A4A;
    padding: 6px 4px 6px 0;
    letter-spacing: .04em;
    flex: 0 0 auto;
  }
  .back-btn svg { display: block; }
  .back-btn:active { opacity: .55; }
  .crumb {
    font-size: clamp(11.5px, 3.2vw, 14px);
    color: #000000;
    font-weight: 600;
    letter-spacing: .02em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1 1 auto;
    min-width: 0;
  }

  /* ============ 滚动区 ============ */
  .scroll-area {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 18px 14px calc(env(safe-area-inset-bottom, 0px) + 72px);
  }

  /* ============ 话题词云 ============ */
  .cloud {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: center;
    gap: 6px 14px;
    padding: 4px 0 36px;
    min-height: calc(100dvh - 180px);
  }

  .topic-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 4px;
    padding: 6px 3px;
    max-width: 94%;
    animation: shake var(--dur, 1.3s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
    will-change: transform;
    -webkit-tap-highlight-color: transparent;
    margin-top: var(--mt, 0px);
    transition: opacity .2s;
  }
  .topic-item:active { opacity: .5; }

  /* 标识：放大 +50%，纯黑加粗 */
  .topic-code {
    font-size: clamp(12px, 3.6vw, 15px);
    font-weight: 700;
    color: #000000;
    letter-spacing: .14em;
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 1px;
  }

  /* 标题：字号 -40%，深灰，分行围绕标识 */
  .topic-title {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    line-height: 1.55;
    letter-spacing: .02em;
    color: #4A4A4A;
    font-weight: 500;
  }
  .topic-title span { display: block; }

  .weight-3 .topic-title { font-size: clamp(10px, 2.9vw, 14.5px); }
  .weight-2 .topic-title { font-size: clamp(9px, 2.5vw, 12.5px); }
  .weight-1 .topic-title { font-size: clamp(8px, 2.2vw, 11px); }

  @keyframes shake {
    0%   { transform: translateY(0) rotate(0deg); }
    22%  { transform: translateY(var(--amp, -7px)) rotate(-.4deg); }
    50%  { transform: translateY(0) rotate(0deg); }
    76%  { transform: translateY(calc(var(--amp, -7px) * -0.55)) rotate(.4deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }

  /* ============ 案例词云 ============ */
  .cases-cloud {
    align-items: flex-start;
    justify-content: center;
    gap: 2px 12px;
    min-height: auto;
    padding: 8px 0 60px;
  }
  .case-item {
    flex: 1 1 calc(50% - 14px);
    max-width: 320px;
    min-width: 130px;
    text-align: left;
    padding: 11px 8px 11px 11px;
    border-left: 1px solid #E6E6E6;
    animation: shake var(--dur, 1.6s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
    will-change: transform;
    margin-top: var(--mt, 0px);
    -webkit-tap-highlight-color: transparent;
    transition: opacity .2s;
  }
  .case-item:active { opacity: .5; }
  .case-org {
    display: block;
    font-size: clamp(10px, 2.7vw, 11.5px);
    color: #8A8A8A;
    margin-bottom: 4px;
    letter-spacing: .03em;
    font-weight: 400;
  }
  .case-name {
    display: block;
    font-size: clamp(12.5px, 3.5vw, 15px);
    color: #4A4A4A;
    line-height: 1.55;
    font-weight: 400;
  }

  /* ============ 弹窗 ============ */
  .modal-mask {
    position: absolute;
    inset: 0;
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, .55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .3s ease, visibility .3s ease;
    padding: 14px;
  }
  .modal-mask.open { opacity: 1; visibility: visible; }

  .modal {
    width: 94%;
    height: 72%;
    max-height: 660px;
    background: #FFFFFF;
    border: 1px solid #E8E8E8;
    border-radius: 16px;
    box-shadow: 0 16px 60px rgba(0, 0, 0, .10);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: scale(.94);
    transition: transform .3s cubic-bezier(.4,0,.2,1);
  }
  .modal-mask.open .modal { transform: scale(1); }

  .modal-head {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 12px 10px 15px;
    border-bottom: 1px solid #F0F0F0;
  }
  .modal-title {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 12.5px;
    font-weight: 600;
    color: #000000;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .mode-btn {
    flex: 0 0 auto;
    font-size: 11px;
    color: #4A4A4A;
    border: 1px solid #DCDCDC;
    border-radius: 999px;
    padding: 4px 10px;
    letter-spacing: .02em;
  }
  .mode-btn:active { background: #F5F5F5; }
  .modal-close {
    flex: 0 0 auto;
    width: 28px; height: 28px;
    line-height: 1;
    font-size: 20px;
    color: #4A4A4A;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:active { background: #F2F2F2; }

  .modal-body {
    flex: 1 1 auto;
    position: relative;
    background: #FAFAFA;
    overflow: hidden;
  }
  .modal-body iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #FFFFFF;
  }
  .modal-reader {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 18px 16px;
    background: #FFFFFF;
    display: none;
    font-size: 13px;
    line-height: 1.8;
    color: #4A4A4A;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .modal-reader.show { display: block; }
  .reader-loading,
  .reader-error {
    color: #999;
    font-size: 12.5px;
    text-align: center;
    padding: 48px 12px;
    line-height: 1.9;
  }

  /* ============ 减少动效 ============ */
  @media (prefers-reduced-motion: reduce) {
    .ring, #splash h1, .hint, .topic-item, .case-item {
      animation: none !important;
    }
    .layer { transition-duration: .15s; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">

  <!-- 开屏 -->
  <section class="layer depth-0" id="splash" aria-label="开屏">
    <h1>近十年全球艺术热点</h1>
  </section>

  <!-- 地域关系图 -->
  <section class="layer is-hidden" id="mapLayer" aria-label="地域关系图">
    <div class="map-wrap">
      <div class="map" id="map" role="group" aria-label="地域同心圆">
        <div class="ring ring-world"></div>
        <div class="ring ring-asia"></div>
        <div class="ring ring-cn"></div>
        <div class="ring ring-gba"></div>

        <div class="ring-label label-world">世界<span>WORLD</span></div>
        <div class="ring-label label-asia">亚洲<span>ASIA</span></div>
        <div class="ring-label label-cn">中国<span>CHINA</span></div>
        <div class="ring-label label-gba">大湾区<span>GBA</span></div>
      </div>
    </div>
    <p class="hint">点击任意圈层，查看该区域的议题</p>
  </section>

  <!-- 话题词云 -->
  <section class="layer is-hidden" id="topicsLayer" aria-label="议题"></section>

  <!-- 案例词云 -->
  <section class="layer is-hidden" id="casesLayer" aria-label="案例"></section>

  <!-- 链接弹窗 -->
  <div class="modal-mask" id="modalMask">
    <div class="modal" role="dialog" aria-modal="true" aria-label="案例链接">
      <div class="modal-head">
        <span class="modal-title" id="modalTitle"></span>
        <button class="mode-btn" id="modeBtn" type="button">阅读模式</button>
        <button class="modal-close" id="modalClose" type="button" aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <iframe id="modalFrame" title="案例链接预览" referrerpolicy="no-referrer"></iframe>
        <div class="modal-reader" id="modalReader"></div>
      </div>
    </div>
  </div>

</div>

/* =========================================================
   工具
   ========================================================= */
const rand = (a, b) => a + Math.random() * (b - a);

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]
  ));
}

function searchUrl(c) {
  const q = [c.org, c.name].filter(Boolean).join(' ');
  return 'https://www.google.com/search?q=' + encodeURIComponent(q);
}

function joinTitle(lines) {
  return lines.map(escapeHtml).join('');
}

/* =========================================================
   状态 & 图层
   ========================================================= */
const state = { view: 'splash', region: null, topic: null };

const el = id => document.getElementById(id);
const splashEl = el('splash');
const mapLayerEl = el('mapLayer');
const topicsLayerEl = el('topicsLayer');
const casesLayerEl = el('casesLayer');

function render() {
  const all = [splashEl, mapLayerEl, topicsLayerEl, casesLayerEl];
  all.forEach(n => n.classList.remove('depth-0', 'depth-1', 'depth-2', 'is-hidden'));

  switch (state.view) {
    case 'splash':
      splashEl.classList.add('depth-0');
      mapLayerEl.classList.add('is-hidden');
      topicsLayerEl.classList.add('is-hidden');
      casesLayerEl.classList.add('is-hidden');
      break;
    case 'map':
      splashEl.classList.add('is-hidden');
      mapLayerEl.classList.add('depth-0');
      topicsLayerEl.classList.add('is-hidden');
      casesLayerEl.classList.add('is-hidden');
      break;
    case 'topics':
      splashEl.classList.add('is-hidden');
      mapLayerEl.classList.add('depth-1');
      topicsLayerEl.classList.add('depth-0');
      casesLayerEl.classList.add('is-hidden');
      break;
    case 'cases':
      splashEl.classList.add('is-hidden');
      mapLayerEl.classList.add('depth-2');
      topicsLayerEl.classList.add('depth-1');
      casesLayerEl.classList.add('depth-0');
      break;
  }
}

/* =========================================================
   开屏
   ========================================================= */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let splashTimer = null;
let splashDone = false;

function finishSplash() {
  if (splashDone) return;
  splashDone = true;
  clearTimeout(splashTimer);
  if (state.view !== 'splash') return;

  state.view = 'map';
  history.replaceState({ app: true, view: 'map' }, '');
  render();
}

splashTimer = setTimeout(finishSplash, reduceMotion ? 1500 : 4000);
splashEl.addEventListener('click', finishSplash);

/* =========================================================
   地图点击
   ========================================================= */
const mapEl = el('map');

mapEl.addEventListener('click', e => {
  const rect = mapEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
  const R = Math.min(rect.width, rect.height) / 2;
  const ratio = dist / R;

  if (ratio > 1.05) return;

  let regionId;
  if (ratio <= 0.25)      regionId = 'gba';
  else if (ratio <= 0.50) regionId = 'cn';
  else if (ratio <= 0.75) regionId = 'asia';
  else                    regionId = 'world';

  openRegion(regionId);
});

/* =========================================================
   导航
   ========================================================= */
function getRegion(id) { return DATA.regions.find(r => r.id === id); }

function openRegion(regionId) {
  state.region = regionId;
  state.topic = null;
  state.view = 'topics';

  renderTopics();
  render();

  history.pushState({ app: true, view: 'topics', region: regionId }, '');
  const sa = topicsLayerEl.querySelector('.scroll-area');
  if (sa) sa.scrollTop = 0;
}

function openTopic(topicId) {
  state.topic = topicId;
  state.view = 'cases';

  renderCases();
  render();

  history.pushState(
    { app: true, view: 'cases', region: state.region, topic: topicId },
    ''
  );
  const sa = casesLayerEl.querySelector('.scroll-area');
  if (sa) sa.scrollTop = 0;
}

function goBack() { history.back(); }

window.addEventListener('popstate', e => {
  const st = e.state;

  if (st && st.app) {
    state.view = st.view;
    state.region = st.region || null;
    state.topic  = st.topic  || null;

    if (state.view === 'topics') renderTopics();
    if (state.view === 'cases') { renderTopics(); renderCases(); }
    render();
  } else {
    state.view = 'map';
    state.region = null;
    state.topic = null;
    render();
  }
});

/* =========================================================
   渲染：话题词云（标识居中，标题分行围绕）
   ========================================================= */
const ARROW_SVG =
  '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M19 12H5M12 19l-7-7 7-7"/></svg>';

function renderTopics() {
  const region = getRegion(state.region);
  if (!region) return;

  topicsLayerEl.innerHTML =
    '<div class="topbar">' +
      '<button class="back-btn" id="topicsBack" type="button" aria-label="返回">' + ARROW_SVG + '返回</button>' +
      '<span class="crumb">' + escapeHtml(region.name) + '</span>' +
    '</div>' +
    '<div class="scroll-area"><div class="cloud" id="topicCloud"></div></div>';

  const cloud = topicsLayerEl.querySelector('#topicCloud');

  region.topics.forEach(t => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'topic-item weight-' + t.weight;

    const titleHtml = t.lines.map(line => '<span>' + escapeHtml(line) + '</span>').join('');

    btn.innerHTML =
      '<span class="topic-code">' + escapeHtml(t.code) + '</span>' +
      '<span class="topic-title">' + titleHtml + '</span>';

    btn.style.setProperty('--mt', rand(0, 38).toFixed(0) + 'px');
    btn.style.setProperty('--amp', rand(-9, -5).toFixed(1) + 'px');
    btn.style.setProperty('--dur', rand(1.1, 1.9).toFixed(2) + 's');
    btn.style.setProperty('--delay', rand(0, 1.6).toFixed(2) + 's');

    btn.addEventListener('click', () => openTopic(t.id));
    cloud.appendChild(btn);
  });

  topicsLayerEl.querySelector('#topicsBack').addEventListener('click', goBack);
}

/* =========================================================
   渲染：案例词云
   ========================================================= */
function renderCases() {
  const region = getRegion(state.region);
  if (!region) return;
  const topic = region.topics.find(t => t.id === state.topic);
  if (!topic) return;

  casesLayerEl.innerHTML =
    '<div class="topbar">' +
      '<button class="back-btn" id="casesBack" type="button" aria-label="返回">' + ARROW_SVG + '返回</button>' +
      '<span class="crumb">' + escapeHtml(topic.code + '　' + joinTitle(topic.lines)) + '</span>' +
    '</div>' +
    '<div class="scroll-area"><div class="cloud cases-cloud" id="caseCloud"></div></div>';

  const cloud = casesLayerEl.querySelector('#caseCloud');

  topic.cases.forEach(c => {
    const url = c.link || searchUrl(c);

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'case-item';
    btn.innerHTML =
      (c.org ? '<span class="case-org">' + escapeHtml(c.org) + '</span>' : '') +
      '<span class="case-name">' + escapeHtml(c.name) + '</span>';

    btn.style.setProperty('--mt', rand(0, 20).toFixed(0) + 'px');
    btn.style.setProperty('--amp', rand(-6, -3).toFixed(1) + 'px');
    btn.style.setProperty('--dur', rand(1.3, 2.1).toFixed(2) + 's');
    btn.style.setProperty('--delay', rand(0, 1.6).toFixed(2) + 's');

    btn.addEventListener('click', () => openModal(c, url));
    cloud.appendChild(btn);
  });

  casesLayerEl.querySelector('#casesBack').addEventListener('click', goBack);
}

/* =========================================================
   弹窗
   ========================================================= */
const modalMask   = el('modalMask');
const modalFrame  = el('modalFrame');
const modalReader = el('modalReader');
const modalTitle  = el('modalTitle');
const modeBtn     = el('modeBtn');
const modalCloseBtn = el('modalClose');

let readerMode = false;
let currentUrl = '';
let autoReaderTimer = null;

function updateModeBtn() {
  modeBtn.textContent = readerMode ? '网页模式' : '阅读模式';
}

function openModal(c, url) {
  currentUrl = url;
  readerMode = false;
  updateModeBtn();

  modalTitle.textContent = c.org ? (c.org + '｜' + c.name) : c.name;

  modalReader.classList.remove('show');
  modalReader.innerHTML = '';
  modalFrame.style.display = 'block';
  modalFrame.src = url;

  modalMask.classList.add('open');

  clearTimeout(autoReaderTimer);
  autoReaderTimer = setTimeout(() => {
    if (!readerMode && modalMask.classList.contains('open')) {
      switchToReader(url);
    }
  }, 3500);
}

async function switchToReader(url) {
  readerMode = true;
  updateModeBtn();
  modalFrame.style.display = 'none';
  modalReader.classList.add('show');
  modalReader.innerHTML = '<div class="reader-loading">正在加载阅读模式…</div>';

  try {
    const res = await fetch('https://r.jina.ai/' + url, { method: 'GET' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    if (!text || text.length < 20) throw new Error('empty');
    modalReader.textContent = text.slice(0, 15000);
  } catch (e) {
    modalReader.innerHTML =
      '<div class="reader-error">该页面暂时无法在弹窗内展示。<br>请稍后重试，或检查网络连接。</div>';
  }
}

modeBtn.addEventListener('click', () => {
  if (readerMode) {
    readerMode = false;
    updateModeBtn();
    modalReader.classList.remove('show');
    modalFrame.style.display = 'block';
  } else {
    switchToReader(currentUrl);
  }
});

function closeModal() {
  modalMask.classList.remove('open');
  clearTimeout(autoReaderTimer);
  setTimeout(() => {
    modalFrame.src = 'about:blank';
    modalReader.classList.remove('show');
    modalReader.innerHTML = '';
  }, 300);
}

modalCloseBtn.addEventListener('click', closeModal);

modalMask.addEventListener('click', e => {
  if (e.target === modalMask) closeModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalMask.classList.contains('open')) closeModal();
});

/* =========================================================
   初始化
   ========================================================= */
render();
</script>
