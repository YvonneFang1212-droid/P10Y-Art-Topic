<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>近十年全球艺术热点</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #FFFFFF;
    color: #4A4A4A;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body { display: flex; align-items: center; justify-content: center; }

  button { font: inherit; background: none; border: none; cursor: pointer; color: inherit; padding: 0; }
  a { text-decoration: none; color: inherit; }

  /* ============ 手机舞台 ============ */
  .stage {
    position: relative;
    width: 100%;
    max-width: 430px;
    height: 100dvh;
    background: #FFFFFF;
    overflow: hidden;
  }
  @media (min-width: 480px) {
    .stage {
      height: min(100dvh, 900px);
      box-shadow: 0 0 80px rgba(0, 0, 0, .06);
    }
  }

  /* ============ 图层 ============ */
  .layer {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: #FFFFFF;
    transition: filter .45s cubic-bezier(.4,0,.2,1),
                opacity .45s cubic-bezier(.4,0,.2,1),
                transform .45s cubic-bezier(.4,0,.2,1),
                visibility .45s;
    will-change: filter, opacity, transform;
  }

  .layer.depth-0 { filter: none; opacity: 1; transform: none; pointer-events: auto; visibility: visible; z-index: 30; }
  .layer.depth-1 { filter: blur(8px); opacity: .30; transform: scale(.98); pointer-events: none; visibility: visible; z-index: 20; }
  .layer.depth-2 { filter: blur(13px); opacity: .16; transform: scale(.96); pointer-events: none; visibility: visible; z-index: 10; }
  .layer.is-hidden { opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }

  /* ============ 开屏 ============ */
  #splash {
    z-index: 60;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  #splash h1 {
    writing-mode: vertical-rl;
    text-orientation: upright;
    letter-spacing: .16em;
    font-size: clamp(11.5px, 3.3vw, 23.6px);
    font-weight: 600;
    color: #000000;
    text-align: center;
    animation: breathe 1.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: .55; transform: scale(.97); }
    50%      { opacity: 1;   transform: scale(1.03); }
  }

  /* ============ 地域关系图 ============ */
  #mapLayer {
    z-index: 50;
    align-items: center;
    justify-content: center;
  }
  .map-wrap {
    width: min(84%, 52vh);
    aspect-ratio: 1 / 1;
    position: relative;
  }
  .map {
    position: absolute;
    inset: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .ring {
    position: absolute;
    left: 50%;
    top: 50%;
    border: 1px solid #C8C8C8;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    will-change: transform, opacity;
  }
  .ring-world { width: 100%; height: 100%; animation: radar 1.9s ease-in-out infinite; animation-delay: .9s; }
  .ring-asia  { width: 75%;  height: 75%;  animation: radar 1.9s ease-in-out infinite; animation-delay: .6s; }
  .ring-cn    { width: 50%;  height: 50%;  animation: radar 1.9s ease-in-out infinite; animation-delay: .3s; }
  .ring-gba   { width: 25%;  height: 25%;  animation: radar 1.9s ease-in-out infinite; animation-delay: 0s; }

  @keyframes radar {
    0%   { transform: translate(-50%, -50%) scale(1);    opacity: .28; }
    45%  { transform: translate(-50%, -50%) scale(1.055); opacity: 1;   }
    100% { transform: translate(-50%, -50%) scale(1);    opacity: .28; }
  }

  .ring-label {
    position: absolute;
    left: 50%;
    text-align: center;
    color: #000000;
    font-weight: 600;
    font-size: clamp(12px, 3.5vw, 18.7px);
    line-height: 1.25;
    white-space: nowrap;
    pointer-events: none;
    letter-spacing: .04em;
  }
  .ring-label span {
    display: block;
    font-size: .52em;
    font-weight: 400;
    color: #7A7A7A;
    letter-spacing: .14em;
    margin-top: 3px;
  }
  .label-world { top: 6.25%;  transform: translate(-50%, -50%); }
  .label-asia  { top: 18.75%; transform: translate(-50%, -50%); }
  .label-cn    { top: 31.25%; transform: translate(-50%, -50%); }
  .label-gba   { top: 43.75%; transform: translate(-50%, -50%); }

  /* ============ 顶部栏 ============ */
  .topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 10px;
    background: rgba(255,255,255,.94);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border-bottom: 1px solid #F4F4F4;
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: clamp(13.2px, 3.5vw, 15.4px);
    color: #4A4A4A;
    padding: 6px 4px 6px 0;
    letter-spacing: .04em;
    flex: 0 0 auto;
  }
  .back-btn svg { display: block; }
  .back-btn:active { opacity: .55; }
  .crumb {
    font-size: clamp(12.6px, 3.5vw, 15.4px);
    color: #000000;
    font-weight: 600;
    letter-spacing: .02em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1 1 auto;
    min-width: 0;
  }

  /* ============ 滚动区 ============ */
  .scroll-area {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 12px calc(env(safe-area-inset-bottom, 0px) + 60px);
    position: relative;
  }

  /* ============ 话题分布区 ============ */
  .topics-cloud {
    position: relative;
    width: 100%;
    height: calc(100dvh - 170px);
    min-height: 460px;
  }

  .topic-slot {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 44%;
    max-width: 195px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .topic-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 5px;
    padding: 6px 4px;
    width: 100%;
    animation: shake var(--dur, 1.3s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
    will-change: transform;
    -webkit-tap-highlight-color: transparent;
    transition: opacity .2s;
  }
  .topic-item:active { opacity: .5; }

  .topic-code {
    font-size: clamp(15.84px, 4.8vw, 19.8px);
    font-weight: 800;
    color: #000000;
    letter-spacing: .14em;
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 3px;
  }

  .topic-title {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    line-height: 1.55;
    letter-spacing: .02em;
    color: #4A4A4A;
    font-weight: 500;
  }
  .topic-title span { display: block; }

  .weight-3 .topic-title { font-size: clamp(11px, 3.2vw, 16px); }
  .weight-2 .topic-title { font-size: clamp(10px, 2.8vw, 13.7px); }
  .weight-1 .topic-title { font-size: clamp(8.8px, 2.4vw, 12px); }

  @keyframes shake {
    0%   { transform: translateY(0) rotate(0deg); }
    22%  { transform: translateY(var(--amp, -7px)) rotate(-.4deg); }
    50%  { transform: translateY(0) rotate(0deg); }
    76%  { transform: translateY(calc(var(--amp, -7px) * -0.55)) rotate(.4deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }

  /* ============ 案例词云 ============ */
  .cases-cloud {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: center;
    gap: 2px 12px;
    padding: 4px 0 40px;
    min-height: calc(100dvh - 180px);
  }
  .case-item {
    display: block;
    flex: 1 1 calc(50% - 14px);
    max-width: 320px;
    min-width: 130px;
    text-align: left;
    padding: 12px 8px 12px 11px;
    border-left: 1px solid #E6E6E6;
    animation: shake var(--dur, 1.6s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
    will-change: transform;
    margin-top: var(--mt, 0px);
    -webkit-tap-highlight-color: transparent;
    transition: opacity .2s;
    cursor: pointer;
  }
  .case-item:active { opacity: .5; }
  .case-org {
    display: block;
    font-size: clamp(11px, 3vw, 12.6px);
    color: #8A8A8A;
    margin-bottom: 4px;
    letter-spacing: .03em;
    font-weight: 400;
  }
  .case-name {
    display: block;
    font-size: clamp(13.7px, 3.8vw, 16.5px);
    color: #4A4A4A;
    line-height: 1.55;
    font-weight: 400;
  }

  /* ============ 减少动效 ============ */
  @media (prefers-reduced-motion: reduce) {
    .ring, #splash h1, .topic-item, .case-item {
      animation: none !important;
    }
    .layer { transition-duration: .15s; }
  }
</style>
</head>

<div class="stage" id="stage">

</div>

/* =========================================================
   工具
   ========================================================= */
const rand = (a, b) => a + Math.random() * (b - a);

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]
  ));
}

function searchUrl(c) {
  const q = [c.org, c.name].filter(Boolean).join(' ');
  return 'https://www.google.com/search?q=' + encodeURIComponent(q);
}

function joinTitle(lines) {
  return lines.map(escapeHtml).join('');
}

/* 话题槽位分配 */
function getSlotPositions(count) {
  if (count === 1) return [{ l: 50, t: 50 }];
  if (count === 2) return [{ l: 28, t: 28 }, { l: 72, t: 72 }];
  if (count === 3) return [{ l: 27, t: 26 }, { l: 73, t: 50 }, { l: 42, t: 78 }];
  if (count === 4) return [{ l: 27, t: 25 }, { l: 73, t: 25 }, { l: 27, t: 75 }, { l: 73, t: 75 }];
  if (count === 5) return [
    { l: 50, t: 14 },
    { l: 20, t: 42 },
    { l: 80, t: 42 },
    { l: 32, t: 80 },
    { l: 68, t: 80 }
  ];
  return null;
}

/* =========================================================
   状态 & 图层
   ========================================================= */
const state = { view: 'splash', region: null, topic: null };

const el = id => document.getElementById(id);
const splashEl = el('splash');
const mapLayerEl = el('mapLayer');
const topicsLayerEl = el('topicsLayer');
const casesLayerEl = el('casesLayer');

function render() {
  const all = [splashEl, mapLayerEl, topicsLayerEl, casesLayerEl];
  all.forEach(n => n.classList.remove('depth-0', 'depth-1', 'depth-2', 'is-hidden'));

  switch (state.view) {
    case 'splash':
      splashEl.classList.add('depth-0');
      mapLayerEl.classList.add('is-hidden');
      topicsLayerEl.classList.add('is-hidden');
      casesLayerEl.classList.add('is-hidden');
      break;
    case 'map':
      splashEl.classList.add('is-hidden');
      mapLayerEl.classList.add('depth-0');
      topicsLayerEl.classList.add('is-hidden');
      casesLayerEl.classList.add('is-hidden');
      break;
    case 'topics':
      splashEl.classList.add('is-hidden');
      mapLayerEl.classList.add('depth-1');
      topicsLayerEl.classList.add('depth-0');
      casesLayerEl.classList.add('is-hidden');
      break;
    case 'cases':
      splashEl.classList.add('is-hidden');
      mapLayerEl.classList.add('depth-2');
      topicsLayerEl.classList.add('depth-1');
      casesLayerEl.classList.add('depth-0');
      break;
  }
}

/* =========================================================
   开屏
   ========================================================= */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let splashTimer = null;
let splashDone = false;

function finishSplash() {
  if (splashDone) return;
  splashDone = true;
  clearTimeout(splashTimer);
  if (state.view !== 'splash') return;

  state.view = 'map';
  history.replaceState({ app: true, view: 'map' }, '');
  render();
}

splashTimer = setTimeout(finishSplash, reduceMotion ? 1500 : 4000);
splashEl.addEventListener('click', finishSplash);

/* =========================================================
   地图点击
   ========================================================= */
const mapEl = el('map');

mapEl.addEventListener('click', e => {
  const rect = mapEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
  const R = Math.min(rect.width, rect.height) / 2;
  const ratio = dist / R;

  if (ratio > 1.05) return;

  let regionId;
  if (ratio <= 0.25)      regionId = 'gba';
  else if (ratio <= 0.50) regionId = 'cn';
  else if (ratio <= 0.75) regionId = 'asia';
  else                    regionId = 'world';

  openRegion(regionId);
});

/* =========================================================
   导航
   ========================================================= */
function getRegion(id) { return DATA.regions.find(r => r.id === id); }

function openRegion(regionId) {
  state.region = regionId;
  state.topic = null;
  state.view = 'topics';

  renderTopics();
  render();

  history.pushState({ app: true, view: 'topics', region: regionId }, '');
  const sa = topicsLayerEl.querySelector('.scroll-area');
  if (sa) sa.scrollTop = 0;
}

function openTopic(topicId) {
  state.topic = topicId;
  state.view = 'cases';

  renderCases();
  render();

  history.pushState(
    { app: true, view: 'cases', region: state.region, topic: topicId },
    ''
  );
  const sa = casesLayerEl.querySelector('.scroll-area');
  if (sa) sa.scrollTop = 0;
}

function goBack() { history.back(); }

window.addEventListener('popstate', e => {
  const st = e.state;

  if (st && st.app) {
    state.view = st.view;
    state.region = st.region || null;
    state.topic  = st.topic  || null;

    if (state.view === 'topics') renderTopics();
    if (state.view === 'cases') { renderTopics(); renderCases(); }
    render();
  } else {
    state.view = 'map';
    state.region = null;
    state.topic = null;
    render();
  }
});

/* =========================================================
   渲染：话题
   ========================================================= */
const ARROW_SVG =
  '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M19 12H5M12 19l-7-7 7-7"/></svg>';

function renderTopics() {
  const region = getRegion(state.region);
  if (!region) return;

  topicsLayerEl.innerHTML =
    '<div class="topbar">' +
      '<button class="back-btn" id="topicsBack" type="button" aria-label="返回">' + ARROW_SVG + '返回</button>' +
      '<span class="crumb">' + escapeHtml(region.name) + '</span>' +
    '</div>' +
    '<div class="scroll-area"><div class="topics-cloud" id="topicCloud"></div></div>';

  const cloud = topicsLayerEl.querySelector('#topicCloud');
  const slots = getSlotPositions(region.topics.length);

  region.topics.forEach((t, i) => {
    const slot = document.createElement('div');
    slot.className = 'topic-slot';

    if (slots) {
      slot.style.left = slots[i].l + '%';
      slot.style.top  = slots[i].t + '%';
    } else {
      slot.style.position = 'relative';
      slot.style.left = '';
      slot.style.top = '';
      slot.style.transform = 'none';
      slot.style.width = '45%';
      slot.style.display = 'inline-flex';
      slot.style.margin = '6px';
    }

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'topic-item weight-' + t.weight;

    const titleHtml = t.lines.map(line => '<span>' + escapeHtml(line) + '</span>').join('');
    btn.innerHTML =
      '<span class="topic-code">' + escapeHtml(t.code) + '</span>' +
      '<span class="topic-title">' + titleHtml + '</span>';

    btn.style.setProperty('--amp', rand(-9, -5).toFixed(1) + 'px');
    btn.style.setProperty('--dur', rand(1.1, 1.9).toFixed(2) + 's');
    btn.style.setProperty('--delay', rand(0, 1.6).toFixed(2) + 's');

    btn.addEventListener('click', () => openTopic(t.id));
    slot.appendChild(btn);
    cloud.appendChild(slot);
  });

  topicsLayerEl.querySelector('#topicsBack').addEventListener('click', goBack);
}

/* =========================================================
   渲染：案例（<a> 直接跳转，新标签打开）
   ========================================================= */
function renderCases() {
  const region = getRegion(state.region);
  if (!region) return;
  const topic = region.topics.find(t => t.id === state.topic);
  if (!topic) return;

  casesLayerEl.innerHTML =
    '<div class="topbar">' +
      '<button class="back-btn" id="casesBack" type="button" aria-label="返回">' + ARROW_SVG + '返回</button>' +
      '<span class="crumb">' + escapeHtml(topic.code + '　' + joinTitle(topic.lines)) + '</span>' +
    '</div>' +
    '<div class="scroll-area"><div class="cases-cloud" id="caseCloud"></div></div>';

  const cloud = casesLayerEl.querySelector('#caseCloud');

  topic.cases.forEach(c => {
    const url = c.link || searchUrl(c);

    const a = document.createElement('a');
    a.className = 'case-item';
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';

    a.innerHTML =
      (c.org ? '<span class="case-org">' + escapeHtml(c.org) + '</span>' : '') +
      '<span class="case-name">' + escapeHtml(c.name) + '</span>';

    a.style.setProperty('--mt', rand(0, 20).toFixed(0) + 'px');
    a.style.setProperty('--amp', rand(-6, -3).toFixed(1) + 'px');
    a.style.setProperty('--dur', rand(1.3, 2.1).toFixed(2) + 's');
    a.style.setProperty('--delay', rand(0, 1.6).toFixed(2) + 's');

    cloud.appendChild(a);
  });

  casesLayerEl.querySelector('#casesBack').addEventListener('click', goBack);
}

/* =========================================================
   初始化
   ========================================================= */
render();
</script>
